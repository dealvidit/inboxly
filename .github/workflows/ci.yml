name: CI

# Deliberately manual-only.
#
# This project is developed by one person against a local database, and `npm run verify`
# covers the same ground before every commit, so an automatic run on every push adds a
# red X without adding information. The workflow is kept complete and correct rather than
# deleted, because the cost of re-enabling it should be one edit, not a rewrite.
#
# To re-enable automatic runs, restore:
#
#   push:
#     branches: [main]
#   pull_request:
#
# It can be run manually at any time from the Actions tab, or with:
#
#   gh workflow run ci.yml
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: inboxly
          POSTGRES_PASSWORD: inboxly
          POSTGRES_DB: inboxly_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U inboxly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI values only. Real secrets live in the deployment platform.
      DATABASE_URL: postgresql://inboxly:inboxly@localhost:5432/inboxly_test
      DIRECT_DATABASE_URL: postgresql://inboxly:inboxly@localhost:5432/inboxly_test
      APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-client-id
      GOOGLE_CLIENT_SECRET: ci-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:3000/api/auth/callback/google
      ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      ANTHROPIC_API_KEY: sk-ant-ci-placeholder
      CRON_SECRET: ci-cron-secret-that-is-long-enough
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The integration tests run against a real Postgres rather than a mock, so the
      # schema has to exist before they connect. Without this the suite fails with
      # `relation "users" does not exist`, which reads like a broken test rather than a
      # missing migration step.
      - name: Migrate test database
        run: npm run db:deploy

      - name: Test
        run: npm run test
        env:
          TEST_DATABASE_URL: postgresql://inboxly:inboxly@localhost:5432/inboxly_test

      - name: Build
        run: npm run build
